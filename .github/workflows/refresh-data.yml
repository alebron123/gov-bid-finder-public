name: Refresh federal data

on:
  schedule:
    # 09:15 UTC daily. SAM.gov publishes the extract around 03:30 UTC; this leaves
    # a wide margin for a late upload and lands before US business hours.
    - cron: "15 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # WHY 20: the download is ~210 MB and the build takes seconds; anything past
    # this is a hung transfer, and the next day's run will try again.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Download SAM.gov extract
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -o "$RUNNER_TEMP/sam.csv" \
            "https://s3.amazonaws.com/falextracts/Contract%20Opportunities/datagov/ContractOpportunitiesFullCSV.csv"
          ls -la "$RUNNER_TEMP/sam.csv"

      - name: Rebuild data.json
        run: node scripts/build-sam.js --csv "$RUNNER_TEMP/sam.csv" --data data.json

      - name: Sanity-check the result
        # WHY 2000: a normal day has 10,000+ open federal notices. Far fewer means a
        # truncated or changed extract; keep yesterday's data rather than publish it.
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const d = JSON.parse(readFileSync("data.json", "utf8"));
            const fed = d.meta.by_source.find((s) => s.label === "sam.gov")?.value ?? 0;
            console.log("federal rows:", fed);
            if (fed < 2000) { console.error("Too few federal notices; refusing to publish."); process.exit(1); }
          '

      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then echo "No change."; exit 0; fi
          git config user.name "govbid-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "chore(data): Daily SAM.gov refresh"
          git push
